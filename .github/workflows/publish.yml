name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref (tag or SHA) to publish"
        required: false

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup npm trusted-publishing client
        run: npm install --global npm@11.16.0 && npm --version

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Load test
        run: npm run test:load

      - name: Pack check
        run: npm pack --dry-run --json >/dev/null

      # Trusted publishing (OIDC): no NPM_TOKEN needed.
      # Requires the trusted publisher to be configured on npmjs.com
      # (package settings -> Trusted Publisher -> GitHub Actions).
      # See docs/PUBLISH.md.
      - name: Publish
        run: npm publish --access public
